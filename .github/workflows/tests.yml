name: Run Tests on Push or Pull Request to Main

on:
  push:
    branches:
      - main  # Run tests on any push to the main branch
  pull_request:
    branches:
      - main  # Run tests on any pull request to the main branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Set your desired Python version

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov  # Ensure pytest-cov is installed

      - name: Run tests with pytest (Handle Exit Code 5)
        # If the exit code is 5 (no tests collected), we force a successful exit
        run: |
          pytest --cov=app
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 5 ]; then
            echo "::warning::Pytest found no tests (Exit Code 5). Allowing build to proceed."
            exit 0
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "Pytest failed with a critical error: Exit Code $EXIT_CODE"
            exit $EXIT_CODE
          fi